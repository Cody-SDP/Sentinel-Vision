# ORCHESTRATION: Multi-job pipeline with dependency gating
# SECURITY: Static Analysis (SAST) must pass before hardware access
# OBSERVABILITY: Centralized logging for both audit and execution

name: Sentinel-Vision Protected Pipeline
on: [push]

# Restrict the default GITHUB_TOKEN to the minimum permissions needed.
# Without this, the token has broad write access to the repository by default,
# which increases the blast radius of a compromised workflow or malicious
# third-party action.
permissions:
  contents: read

jobs:
  # JOB 1: The Security Gatekeeper
  security-audit:
    runs-on: ubuntu-latest # Run this in the cloud to save your local electricity
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        # Pin the version to match requirements-dev.txt so CI and local runs
        # use identical tooling and an unpinned upgrade cannot silently change
        # scan results.
        run: pip install bandit==1.8.3

      - name: Run Bandit Security Scan
        # This scans for hardcoded passwords, insecure imports, and "shell=True" risks
        run: bandit -r . -ll -ii

  # JOB 2: The Hardware Execution
  run-tests:
    needs: security-audit # <--- CRITICAL: This "Gate" prevents training if Job 1 fails!
    runs-on: self-hosted 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify GPU is connected
        run: nvidia-smi

      - name: Run AI Training Script (Verified Environment)
        run: python train.py

# CI/CD using GitHub Actions (workflow)